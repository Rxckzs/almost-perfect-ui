<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Almost Perfect UI</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    /* --- Existing glass SaaS CSS --- */
    :root {
      --glass-bg: rgba(27, 32, 49, 0.97);
      --glass-blur: 18px;
      --primary: #13c2e9;
      --accent: #ff63da;
      --danger: #ff3b3b;
      --success: #6cffb2;
      --neutral: #16181f;
      --shadow: 0 6px 24px rgba(0,0,0,0.41);
      --card-radius: 22px;
      --border: 1.5px solid rgba(255,255,255,0.10);
      --header-height: 66px;
      font-family: 'Segoe UI', 'Arial', sans-serif;
    }
    html, body {
      background: linear-gradient(135deg,#132033,#1c2141 60%,#282e46 100%);
      margin: 0; min-height: 100vh;
      color: #f3f4f8;
      font-family: var(--font);
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      height: var(--header-height);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(var(--glass-blur));
      background: var(--glass-bg);
      box-shadow: var(--shadow);
      border-bottom: var(--border);
      z-index: 10;
    }
    header h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg,var(--primary),var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      user-select: none;
      transition: scale 0.2s;
    }
    header h1:hover { text-shadow: 0 2px 22px var(--accent), 0 0px 4px var(--primary); scale: 1.032;}
    header .save-btn {
      outline: none;
      border: none;
      border-radius: 15px;
      background: linear-gradient(90deg,#13c2e9,#ff63da);
      color: #22232a;
      font-weight: bold;
      font-size: 1.075rem;
      padding: 11px 28px;
      box-shadow: 0 3px 14px rgba(32,60,180,0.16);
      cursor: pointer;
      transition: filter 0.18s, transform 0.2s;
    }
    header .save-btn:active { filter: brightness(90%); transform: scale(0.96);}
    main {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      grid-gap: 40px;
      padding: 48px 48px 36px 48px;
      width: 100%;
      box-sizing: border-box;
    }
    .card {
      background: var(--glass-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--card-radius);
      border: var(--border);
      padding: 34px 22px 28px 22px;
      transition: box-shadow 0.26s;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 260px;
      overflow: hidden;
    }
    .card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      text-shadow: 0 2px 8px #1a2b45aa;
      margin-top: 0;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    #todo-list {
      padding: 0;
      list-style: none;
      margin: 0 0 20px 0;
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #214969 #181b24;
    }
    #todo-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(27,36,61,0.65);
      border-radius: 12px;
      margin-bottom: 8px;
      padding: 8px 16px;
      box-shadow: 0 2px 10px #1a2b4522;
      transition: background 0.15s, filter 0.3s;
      cursor: pointer;
      font-size: 1.1em;
    }
    #todo-list li.completed {
      background: linear-gradient(90deg,#25715bcc,#183d3d 95%);
      text-decoration: line-through;
      opacity: 0.75;
      color: #94e9d1;
      filter: brightness(1.09);
    }
    #todo-list li .del-btn {
      color: var(--danger);
      background: none;
      border: none;
      font-size: 1.15rem;
      margin-left: 12px;
      cursor: pointer;
      opacity: 0.83;
      transition: opacity 0.19s;
    }
    #todo-list li .del-btn:hover { opacity: 1; }
    .add-todo-bar {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .add-todo-bar input {
      flex: 1;
      background: rgba(18,22,34,0.59);
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 1.07rem;
      color: #fcfcff;
      box-shadow: none;
      outline: none;
      transition: background 0.16s;
    }
    .add-todo-bar input:focus { background: #232846; }
    .add-todo-bar button {
      padding: 10px 20px;
      border-radius: 9px;
      outline: none;
      border: none;
      background: linear-gradient(90deg,var(--primary),var(--accent));
      color: #181b24;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: filter 0.16s,transform 0.15s;
    }
    .add-todo-bar button:active {filter:brightness(0.9);transform:scale(0.97);}
    .progress-section { position: relative; }
    .progress-bg {
      width: 100%;
      height: 32px;
      background: linear-gradient(90deg,#2e2f3e,#232846,#141826 95%);
      border-radius: 14px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 2px 10px #0a112210;
      border: 1.5px solid #293048aa;
      position:relative;
    }
    .progress-fill {
      position: absolute;
      height: 100%;
      min-width: 30px;
      border-radius: 14px;
      top: 0; left: 0;
      transition: width 0.7s cubic-bezier(.22,.61,.36,1), background 0.33s;
      box-shadow: 0 2px 10px #49d7ff20;
      background: linear-gradient(90deg,#13c2e9, #ff63da 105%);
    }
    .progress-label {
      position: absolute;
      width: 100%;
      top: 0; left: 0;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.12rem;
      color: #fff;
      text-shadow: 0 3px 20px #23284655;
      z-index: 3;
    }
    .stats-bar {
      display: flex;
      gap: 22px;
      margin-bottom: 18px;
      justify-content: space-around;
      flex-wrap: wrap;
    }
    .stat-item {
      background: rgba(40,34,55,0.42);
      border-radius: 6px;
      padding: 14px 20px;
      min-width: 78px;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 1.5px 8px #1a2b4528;
      text-align: center;
      margin-bottom: 8px;
    }
    .stat-number {
      display: block;
      font-size: 1.5em;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 2px 8px var(--primary);
    }
    .chart-canvas {
      width: 100%;
      height: 80px;
      background: linear-gradient(90deg,#283c5e33,#23435613 85%);
      margin-top: 16px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 12px #231b2e17;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-evenly;
      padding: 0 10px;
      gap: 10px;
    }
    .chart-bar {
      width: 32px;
      background: linear-gradient(180deg,#ff63da 65%,#13c2e9 100%);
      border-radius: 5px 5px 0 0;
      box-shadow: 0 2px 9px #1a2b4599;
      transition: height 0.7s cubic-bezier(.21,.87,.35,1);
      display: inline-block;
    }
    .timer-clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-height: 74px;
      margin-top: 10px;
      font-size: 2.08em;
      color: var(--primary);
      font-family: 'Orbitron',monospace,Arial;
      text-shadow: 0 5px 18px #22fff930;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    .timer-controls {
      display: flex;
      gap: 13px;
      margin-top: 3px;
    }
    .timer-controls button {
      padding: 8px 22px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: linear-gradient(90deg,#13c2e9,#ff63da);
      color: #22232a;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 1px 10px #1a2b4532;
      cursor: pointer;
      transition: filter 0.11s,transform 0.14s;
    }
    .timer-controls button:active {
      filter: brightness(0.85);
      transform: scale(0.95);
    }
    .card::before {
      content: '';
      position: absolute;
      top: -80px; left: -80px;
      width: 220px; height: 220px;
      background: radial-gradient(circle,var(--accent) 0%,transparent 80%);
      filter: blur(48px);
      opacity: 0.33;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.5s;
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: -60px; right: -60px;
      width: 180px; height: 180px;
      background: radial-gradient(circle,var(--primary) 0%,transparent 80%);
      filter: blur(37px);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.5s;
    }
    .card:hover::before,
    .card:hover::after {
      opacity: 0.50;
    }
    /* --- Modal styles --- */
    .modal-bg {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(14, 17, 36, 0.52);
      z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px);
    }
    .modal {
      background: rgba(34, 42, 59, 0.95);
      border-radius: 24px;
      box-shadow: 0 6px 38px #1a2b45cc;
      padding: 44px 38px 32px 38px;
      color: #fff;
      min-width: 340px;
      max-width: 90vw;
      font-size: 1.03em;
      max-height: 86vh;
      overflow: auto;
      position: relative;
      animation: modalIn 0.42s cubic-bezier(.27,.85,.46,1.02);
    }
    @keyframes modalIn {
      from { transform: scale(0.88) translateY(34px); opacity: 0;}
      to {   transform: scale(1)   translateY(0px);   opacity: 1;}
    }
    .modal h3 {
      margin-top: 0; margin-bottom: 20px;
      background: linear-gradient(90deg, #13c2e9 70%, #ff63da 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.35em;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    .close-modal {
      position: absolute; right: 28px; top: 28px;
      color: var(--danger);
      background: none;
      border: none;
      font-size: 1.48em;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s;
      z-index: 2;
    }
    .close-modal:hover { opacity: 1;}
    .modal-content pre {
      background: #1a2437e3;
      padding: 13px 14px;
      border-radius: 13px;
      font-size: 0.98em;
      box-shadow: 0 1.5px 8px #23264a40;
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media(max-width: 950px){
      main{grid-gap:20px;padding:36px 8px 18px 8px;}
      .card{padding:22px 3px 14px 4px;}
    }
    @media(max-width:630px){
      main{padding:0;}
      header{padding:0 8px;}
      .card{min-height:130px;}
    }
  </style>
</head>
<body>
<header>
  <h1 id="logo-btn">Almost Perfect UI</h1>
  <button class="save-btn">Save</button>
</header>
<main>
  <section class="card" style="flex:2;">
    <h2>To-do List</h2>
    <ul id="todo-list"></ul>
    <div class="add-todo-bar">
      <input id="todo-input" type="text" placeholder="Add a task..."/>
      <button id="add-todo-btn">Add</button>
    </div>
  </section>
  <section class="card progress-section" style="flex:1;">
    <h2>Progress</h2>
    <div class="progress-bg">
      <div class="progress-fill"></div>
      <div class="progress-label"></div>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><span class="stat-number" id="stat-today"></span>Tasks Today</div>
      <div class="stat-item"><span class="stat-number" id="stat-comp"></span>Completed</div>
      <div class="stat-item"><span class="stat-number" id="stat-eff"></span>Efficiency</div>
    </div>
    <div class="chart-canvas" id="chart-area"></div>
  </section>
  <section class="card" style="flex:1;">
    <h2>Work Timer</h2>
    <div class="timer-clock" id="timer-clock">00:00:00</div>
    <div class="timer-controls">
      <button id="timer-start">Start</button>
      <button id="timer-pause">Pause</button>
      <button id="timer-reset">Reset</button>
    </div>
  </section>
</main>
<script>
const DB_KEY = "almost-perfect-ui-db";
function loadDB() {
  const dbRaw = localStorage.getItem(DB_KEY);
  if (!dbRaw) return { todos: [], timer: 0, today: 0, completed: 0, logs: [] };
  try { return JSON.parse(dbRaw); } catch { return { todos: [], timer: 0, today: 0, completed: 0, logs: [] }; }
}
function saveDB(db) {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}
function addLog(event, details) {
  appData.logs = appData.logs || [];
  appData.logs.push({event, details, t: new Date().toLocaleString()});
  saveDB(appData);
}
function clearDB() {
  localStorage.removeItem(DB_KEY);
}
/* ----- To-do List Logic ----- */
let appData = loadDB();

function renderTodos() {
  const list = document.getElementById('todo-list');
  list.innerHTML = "";
  appData.todos.forEach((t,i) => {
    let li = document.createElement('li');
    li.textContent = t.text;
    if (t.done) li.classList.add('completed');
    li.onclick = () => {
      appData.todos[i].done = !appData.todos[i].done;
      addLog("toggle-todo", "Toggled todo: "+t.text);
      renderTodos(); updateStats();
    };
    let delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.textContent = "×";
    delBtn.onclick = e => {
      e.stopPropagation();
      addLog("delete-todo", "Deleted todo: " + t.text);
      appData.todos.splice(i,1);
      renderTodos(); updateStats();
    };
    li.appendChild(delBtn);
    list.appendChild(li);
  });
}
document.getElementById("add-todo-btn").onclick = () => {
  let val = document.getElementById("todo-input").value.trim();
  if (val) {
    appData.todos.push({ text: val, done: false });
    addLog("add-todo", "Added todo: " + val);
    document.getElementById("todo-input").value = "";
    renderTodos(); updateStats();
  }
};
/* --- Progress Bar (Reflects true progress) --- */
function updateProgressBar() {
  let total = appData.todos.length;
  let comp = appData.todos.filter(t=>t.done).length;
  let val = total ? Math.round(100*comp/total) : 0;
  document.querySelector('.progress-fill').style.width = `${val}%`;
  document.querySelector('.progress-label').textContent = `Progress: ${val}%`;
}
/* --- Stats: completed/efficiency calculation includes short task penalty --- */
function updateStats() {
  let total = appData.todos.length;
  let comp = appData.todos.reduce((sum, t) => t.done ? sum + (t.text.trim().length<3 ? 0.5 : 1) : sum, 0);
  let today = total;
  let eff = total ? Math.round(100*comp/total) : 0;
  appData.today = today;
  appData.completed = comp;
  appData.efficiency = eff;
  document.getElementById('stat-today').textContent = today;
  document.getElementById('stat-comp').textContent = comp;
  document.getElementById('stat-eff').textContent = eff+"%";
  drawChart(today, comp, eff);
  updateProgressBar();
  saveDB(appData);
}
function drawChart(today, comp, eff) {
  const c = document.getElementById("chart-area");
  c.innerHTML="";
  let bars = [
    { label: "Total", value: today, color: "#ff63da" },
    { label: "Done", value: comp, color: "#13c2e9" },
    { label: "Eff", value: eff, color: "#6cffb2" }
  ];
  let max = Math.max(today, comp, eff, 1);
  bars.forEach(bar => {
    let div = document.createElement("div");
    div.className = "chart-bar";
    div.style.height = (60 * bar.value/max + 18) + "px";
    div.style.background = `linear-gradient(180deg,${bar.color} 65%,#23254a 100%)`;
    c.appendChild(div);
  });
}
/* --- Timer (sequentially speeds up, logs pause/stop/reset) --- */
let timerStartTime = null;
let timerPaused = true;
let timerOffset = appData.timer || 0;
let timerInterval = null;
let timerSpeed = 1.0;
let timerAccelInterval = null;

function formatTimerSecs(s) {
  let hrs = Math.floor(s/3600), mins = Math.floor((s%3600)/60), secs = s%60;
  return [
    hrs.toString().padStart(2,'0'),
    mins.toString().padStart(2,'0'),
    secs.toString().padStart(2,'0')
  ].join(':');
}
function renderTimer() {
  let now = performance.now();
  let t=timerOffset;
  if(timerStartTime && !timerPaused)
    t += Math.floor((now-timerStartTime)/1000 * timerSpeed);
  document.getElementById("timer-clock").textContent = formatTimerSecs(t);
}
function timerStart() {
  if (!timerStartTime || timerPaused) {
    timerStartTime = performance.now();
    timerPaused = false;
    if (!timerInterval) timerInterval = setInterval(() => {
      renderTimer();
      let now = performance.now();
      let seconds = timerOffset;
      if(timerStartTime && !timerPaused)
        seconds += Math.floor((now-timerStartTime)/1000 * timerSpeed);
      appData.timer = seconds;
      saveDB(appData);
    }, 400);
    if (!timerAccelInterval) timerAccelInterval = setInterval(() => {
      if (!timerPaused) timerSpeed += 0.09;
    }, 4000);
  }
}
function timerPause() {
  if (!timerPaused && timerStartTime) {
    let now = performance.now();
    timerOffset += Math.floor((now-timerStartTime)/1000 * timerSpeed);
    timerPaused = true;
    timerStartTime = null;
    renderTimer();
    clearInterval(timerInterval); timerInterval = null;
    clearInterval(timerAccelInterval); timerAccelInterval = null;
    appData.timer = timerOffset;
    saveDB(appData);
    addLog("pause-timer",`Paused timer at ${formatTimerSecs(timerOffset)}`);
    timerSpeed = 1.0;
  }
}
function timerReset() {
  timerPaused = true;
  timerStartTime = null;
  timerOffset = 0;
  timerSpeed = 1.0;
  clearInterval(timerInterval); timerInterval = null;
  clearInterval(timerAccelInterval); timerAccelInterval = null;
  appData.timer = 0;
  saveDB(appData);
  renderTimer();
  addLog("reset-timer", "Timer reset");
}
document.getElementById("timer-start").onclick = timerStart;
document.getElementById("timer-pause").onclick = timerPause;
document.getElementById("timer-reset").onclick = timerReset;
/* ------ Save Button ------ */
document.querySelector('.save-btn').onclick = function() {
  appData.timer = timerOffset;
  saveDB(appData);
  this.textContent = "Saved!";
  this.disabled = true;
  setTimeout(()=>{
    this.textContent = "Save";
    this.disabled = false;
    let h = document.createElement("div");
    h.style.position="fixed";h.style.left="0";h.style.top="0";h.style.width="100vw";h.style.height="100vh";
    h.style.zIndex="99";h.style.background="rgba(15,24,36,0.28)";
    h.style.backdropFilter="blur(8px)";
    h.style.display="flex";
    h.style.alignItems="center";
    h.style.justifyContent="center";
    h.innerHTML = `<div style="padding:48px 54px;border-radius:28px;background:rgba(12,28,38,0.82);color:#13c2e9;box-shadow:0 6px 32px #1a2b4599;font-size:1.32rem;font-weight:bold;opacity:0.98;transition:0.2s;">Database saved!</div>`;
    document.body.appendChild(h);
    setTimeout(()=>{h.style.opacity="0.08";},1600);
    setTimeout(()=>{document.body.removeChild(h);},2000);
  },600);
};
/* ------ Database Modal ------ */
function showDatabaseModal() {
  let db = loadDB();
  let modalBg = document.createElement('div');
  modalBg.className = 'modal-bg';
  let modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <button class="close-modal" title="Close">&times;</button>
    <h3>Almost Perfect UI Database</h3>
    <div class="modal-content">
      <pre><b>To-do List:</b>
${db.todos.map((t,i) => `  - [${t.done ? "✔":" "}] (${i+1}) "${t.text}"`).join('\n') || '  (no todos)'}
<b>Stats:</b>
  Tasks Today: ${db.today??0}
  Completed   : ${db.completed??0}
  Efficiency  : ${db.efficiency??0}%
  Timer       : ${formatTimerSecs(db.timer??0)}
<b>Actions/History:</b>
${(db.logs||[]).slice(-10).map(log => `[${log.t}] (${log.event}) ${log.details}`).join('\n') || '  (no log entries)'}
      </pre>
    </div>
  `;
  modalBg.appendChild(modal);
  document.body.appendChild(modalBg);
  modal.querySelector('.close-modal').onclick = () => {
    document.body.removeChild(modalBg);
  };
  modalBg.onclick = e => {
    if (e.target === modalBg) document.body.removeChild(modalBg);
  };
}
/* --- Logo click handler --- */
document.getElementById('logo-btn').onclick = showDatabaseModal;
/* ------ Initialization ------ */
window.addEventListener("DOMContentLoaded",()=>{
  renderTodos(); updateStats(); renderTimer();
  window.addEventListener("resize",()=>drawChart(appData.today, appData.completed, parseInt(document.getElementById('stat-eff').textContent)));
});
</script>
</body>
</html>
